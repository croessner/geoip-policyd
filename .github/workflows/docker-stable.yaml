name: Production Docker Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract tag versions
        id: extract_version
        run: |
          tag="${GITHUB_REF_NAME}"
          base="${tag%%-*}"
          image="ghcr.io/${{ github.repository_owner }}/geoip-policyd"
          IFS='.' read -r major minor _patch <<< "${base}"

          {
            echo "docker_tags<<EOF"
            echo "${image}:${tag}"
            if [[ "${tag}" != *-* ]]; then
              echo "${image}:latest"
              echo "${image}:${major}"
              echo "${image}:${major}.${minor}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.extract_version.outputs.docker_tags }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Policy server that blocks senders based on country and IP diversity
