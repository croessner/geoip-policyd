name: Run Unit Tests

on:
  push:
    branches:
      - features
  pull_request:
    branches:
      - features

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

      - name: Guardrails
        run: make guardrails
        env:
          GOLANGCI_NEW_FROM_REV: HEAD~
