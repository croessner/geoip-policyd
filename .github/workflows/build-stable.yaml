name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: 'geoip-policyd'
  MAINTAINER: 'croessner'
  DESC: 'Policy server that blocks senders based on country and IP diversity.'
  CHGELOG_VERSION: '0.15.4'

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -mod=vendor -ldflags="-s -X main.version=${GITHUB_REF#refs/tags/}-${GITHUB_SHA:0:8}" -o ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }} .
      - name: Create artifact
        run: |
          assets="${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "$assets"
          mkdir -p "dist/$assets"
          cp -r ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }} LICENSE README.md "dist/$assets/"
          cp systemd/${{ env.APP_NAME }}.service "dist/$assets/"
          cp systemd/${{ env.APP_NAME }} "dist/$assets/"
          (
            cd dist
            tar czf "$assets.tar.gz" "$assets"
            ls -lah ./*.tar.gz
          )
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz

  build-linux-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [ linux ]
        goarch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -mod=vendor -ldflags="-s -X main.version=${GITHUB_REF#refs/tags/}-${GITHUB_SHA:0:8}" -o ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Export package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "PACKAGE_VERSION=${version//-/\~}" >> "$GITHUB_ENV"

      - name: Copy binaries
        run: |
          mkdir -p .debpkg/usr/sbin
          mkdir -p .debpkg/usr/lib/systemd/system
          mkdir -p .debpkg/etc/default
          mkdir -p .debpkg/usr/share/doc/${{ env.APP_NAME }}
          cp ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }} .debpkg/usr/sbin/${{ env.APP_NAME }}
          cp systemd/${{ env.APP_NAME }}.service .debpkg/usr/lib/systemd/system/
          cp systemd/${{ env.APP_NAME }} .debpkg/etc/default/
          cp LICENSE README.md .debpkg/usr/share/doc/${{ env.APP_NAME }}/

      - uses: jiro4989/build-deb-action@v3
        with:
          package: ${{ env.APP_NAME }}
          package_root: .debpkg
          maintainer: ${{ env.MAINTAINER }}
          version: ${{ env.PACKAGE_VERSION }}
          arch: '${{ matrix.goarch }}'
          desc: '${{ env.DESC }}'

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}-deb
          path: |
            ./*.deb

  create-release:
    runs-on: ubuntu-latest
    needs:
      - build-artifact
      - build-linux-packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          wget https://github.com/git-chglog/git-chglog/releases/download/v${{ env.CHGELOG_VERSION }}/git-chglog_${{ env.CHGELOG_VERSION }}_linux_amd64.tar.gz
          tar xzf git-chglog_${{ env.CHGELOG_VERSION }}_linux_amd64.tar.gz
          chmod +x git-chglog
          latest_tag="$(git describe --tags "$(git rev-list --tags --max-count=1)")"
          ./git-chglog --output ./changelog "${latest_tag}"

      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install -y gh

      - name: Detect release type
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GEOIP_POLICYD_TOKEN }}
        run: |
          release_args=(
            "${GITHUB_REF_NAME}"
            ./changelog
            --title "Release ${GITHUB_REF_NAME}"
            --notes-file ./changelog
            --draft=false
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

  upload-release:
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        goos: [ linux ]
        goarch: [ amd64, arm64 ]
        include:
          - os: ubuntu-latest
            asset_suffix: .tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install -y gh

      - name: Download Artifact
        env:
          GH_TOKEN: ${{ secrets.GEOIP_POLICYD_TOKEN }}
        run: gh run download --name artifact-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GEOIP_POLICYD_TOKEN }}
        run: gh release upload ${{ github.ref_name }} ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.asset_suffix }}

  upload-linux-packages:
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        goos: [ linux ]
        goarch: [ amd64, arm64 ]
        include:
          - pkg: deb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt update && sudo apt install -y gh

      - name: Download Artifact
        env:
          GH_TOKEN: ${{ secrets.GEOIP_POLICYD_TOKEN }}
        run: gh run download --name artifact-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.pkg }}

      - name: Select package asset
        run: |
          asset_name="$(find . -maxdepth 1 -type f -name '*.${{ matrix.pkg }}' -print -quit)"
          asset_name="${asset_name#./}"
          echo "ASSET_NAME=${asset_name}" >> "$GITHUB_ENV"

      - name: Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GEOIP_POLICYD_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ASSET_NAME}"
